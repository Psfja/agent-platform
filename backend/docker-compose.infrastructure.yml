services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent_platform
      POSTGRES_PASSWORD: agent_platform_dev
    ports:
      - "5432:5432"
    volumes:
      - agent_platform_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - agent_platform_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agent-platform
      MINIO_ROOT_PASSWORD: agent-platform-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - agent_platform_minio:/data

volumes:
  agent_platform_postgres:
  agent_platform_redis:
  agent_platform_minio:
